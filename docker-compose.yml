services:
  tv-controler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tv-controler
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SELF_HOSTED=true
      - HIDE_BILLING=true
      - DISABLE_HOMEPAGE=true
      - DATA_DIR=/data
    volumes:
      - st-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  st-data:
